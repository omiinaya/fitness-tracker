<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta
      name="description"
      content="Track your workouts, exercises, and fitness progress with this modern fitness tracker app."
    />
    <meta
      name="keywords"
      content="fitness, tracker, workout, exercise, health, progress"
    />
    <meta name="author" content="Omar Minaya" />
    <title>Fitness Tracker</title>
    <link rel="canonical" href="https://evening-chamber-94304.herokuapp.com/" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="manifest" href="/manifest.json" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css"
      integrity="sha384-6QKq6QwQ6QKq6QwQ6QKq6QwQ6QKq6QwQ6QKq6QwQ6QKq6QwQ6QKq6QwQ6QKq6QwQ"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <meta name="theme-color" content="#2185d0" />
    <meta property="og:title" content="Fitness Tracker" />
    <meta
      property="og:description"
      content="Track your workouts, exercises, and fitness progress."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://evening-chamber-94304.herokuapp.com/"
    />
    <meta property="og:image" content="/assets/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fitness Tracker" />
    <meta
      name="twitter:description"
      content="Track your workouts, exercises, and fitness progress."
    />
    <meta name="twitter:image" content="/assets/og-image.png" />
  </head>

  <body>
    <a href="#main-content" class="visually-hidden focusable skip-link"
      >Skip to main content</a
    >
    <nav aria-label="Main navigation">
      <ul class="ui menu">
        <li><a href="/" aria-current="page">Fitness Tracker</a></li>
        <li><a href="/stats">Dashboard</a></li>
        <li>
          <a
            href="https://github.com/omminaya/fitness-tracker"
            target="_blank"
            rel="noopener"
            aria-label="View source on GitHub"
            >GitHub</a
          >
        </li>
      </ul>
    </nav>
    <main id="main-content" tabindex="-1">
      <div class="wrapper workout">
        <header>
          <h1>Fitness Tracker</h1>
        </header>
        <div class="ui container workout">
          <section
            class="ui raised card m-auto"
            aria-labelledby="last-workout-heading"
          >
            <div class="prev-workout">
              <h2 id="last-workout-heading">Last Workout</h2>
              <div>
                <div class="workout-stats" aria-live="polite"></div>
                <div class="buttons">
                  <a
                    id="continue-btn"
                    href="/exercise?"
                    class="huge ui blue button"
                    aria-label="Continue last workout"
                    >Continue Workout</a
                  >
                  <a
                    href="/exercise"
                    class="huge positive ui button"
                    aria-label="Start a new workout"
                    >New Workout</a
                  >
                </div>
              </div>
            </div>
            <div class="new-workout">
              <h2>Create Your First Workout</h2>
            </div>
          </section>
        </div>
      </div>
      <div id="toast" role="status" aria-live="polite" class="visually-hidden">
        Workout Added Successfully!
      </div>
    </main>
    <script src="/api.js"></script>
    <script src="/workout.js"></script>
    <script src="/index.js"></script>
    <style>
      .visually-hidden {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        border: 0 !important;
      }

      .focusable:active,
      .focusable:focus {
        position: static !important;
        width: auto !important;
        height: auto !important;
        margin: 0 !important;
        overflow: visible !important;
        clip: auto !important;
        outline: 2px solid #2185d0;
        background: #fff;
        color: #2185d0;
        z-index: 1000;
      }

      html {
        font-size: 100%;
      }

      body {
        color: #222;
        background: #fff;
      }

      @media (prefers-color-scheme: dark) {
        body {
          color: #fff;
          background: #121212;
        }
      }
    </style>
  </body>
</html>
