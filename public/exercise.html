<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta name="description" content="Add and track your exercises and workouts." />
  <meta name="keywords" content="fitness, tracker, workout, exercise, health" />
  <meta name="author" content="Omar Minaya" />
  <title>Add Exercise | Fitness Tracker</title>
  <link rel="canonical" href="https://evening-chamber-94304.herokuapp.com/exercise" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2185d0" />
  <meta property="og:title" content="Add Exercise | Fitness Tracker" />
  <meta property="og:description" content="Add and track your exercises and workouts." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://evening-chamber-94304.herokuapp.com/exercise" />
  <meta property="og:image" content="/assets/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Add Exercise | Fitness Tracker" />
  <meta name="twitter:description" content="Add and track your exercises and workouts." />
  <meta name="twitter:image" content="/assets/og-image.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      border: 0 !important;
    }

    .focusable:active,
    .focusable:focus {
      position: static !important;
      width: auto !important;
      height: auto !important;
      margin: 0 !important;
      overflow: visible !important;
      clip: auto !important;
      outline: 2px solid #2185d0;
      background: #fff;
      color: #2185d0;
      z-index: 1000;
    }

    html {
      font-size: 100%;
    }

    body {
      color: #222;
      background: #fff;
    }

    @media (prefers-color-scheme: dark) {
      body {
        color: #fff;
        background: #121212;
      }
    }
  </style>
</head>

<body>
  <a href="#main-content" class="visually-hidden focusable skip-link">Skip to main content</a>
  <nav aria-label="Main navigation">
    <a href="/">Fitness Tracker</a>
    <a href="/stats">Dashboard</a>
  </nav>
  <main id="main-content" tabindex="-1">
    <div class="wrapper">
      <header>
        <h1>Fitness Tracker</h1>
      </header>
      <div class="ui container exercise">
        <div class="ui raised card m-auto">
          <h2>Add Your Exercise</h2>
          <form action="POST" aria-label="Add Exercise Form">
            <div class="workout-type">
              <label for="type">Exercise Type:</label>
              <select name="type" id="type">
                <option disabled selected>Select Exercise Type</option>
                <option value="resistance">Resistance</option>
                <option value="cardio">Cardio</option>
              </select>
            </div>
            <div class="cardio-form d-none">
              <div class="cardio-name">
                <label for="cardio-name">Name:</label>
                <input type="text" name="cardio-name" id="cardio-name" placeholder="Running" />
              </div>
              <div class="distance">
                <label for="distance">Distance (miles):</label>
                <input type="number" name="distance" id="distance" placeholder="5" />
              </div>
              <div class="duration">
                <label for="duration">Duration (minutes):</label>
                <input type="number" name="duration" id="duration" placeholder="10" />
              </div>
            </div>
            <div class="resistance-form d-none">
              <div class="exercise">
                <label for="name">Exercise Name:</label>
                <input type="text" name="name" id="name" placeholder="Bench Press" />
              </div>
              <div class="weight">
                <label for="weight">Weight (lbs):</label>
                <input type="number" name="weight" id="weight" placeholder="200" />
              </div>
              <div class="sets">
                <label for="sets">Sets:</label>
                <input type="number" name="sets" id="sets" placeholder="4" />
              </div>
              <div class="reps">
                <label for="reps">Reps:</label>
                <input type="number" name="reps" id="reps" placeholder="10" />
              </div>
              <div class="resistance-duration">
                <label for="resistance-duration">Duration (minutes):</label>
                <input type="number" name="resistance-duration" id="resistance-duration" placeholder="10" />
              </div>
            </div>
            <div class="buttons">
              <button disabled class="huge ui blue button complete">
                Complete
              </button>
              <button disabled class="huge ui positive button add-another">
                Add Exercise
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite" class="visually-hidden">
      Workout Added Successfully!
    </div>
  </main>
  <script src="/api.js"></script>
  <script src="/exercise.js"></script>
</body>

</html>
